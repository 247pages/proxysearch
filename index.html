<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyKode Scraper Pro</title>
    <style>
        :root { --primary: #38bdf8; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 15px; padding-bottom: 300px; }
        .container { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid #334155; max-width: 500px; margin: auto; }
        h2 { color: var(--primary); margin: 0 0 15px 0; font-size: 1.2rem; }
        textarea { width: 100%; background: #0b1120; border: 1px solid #475569; color: white; padding: 12px; border-radius: 8px; margin-bottom: 15px; min-height: 80px; box-sizing: border-box; font-size: 16px; }
        button { background: var(--primary); color: #000; border: none; padding: 14px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; font-size: 1rem; }
        button:disabled { opacity: 0.5; }
        #videoArea { margin-top: 20px; display: none; }
        .video-box { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 10px; overflow: hidden; background: #000; }
        .video-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        
        /* Mobile Console Styles */
        #mobileConsole { position: fixed; bottom: 0; left: 0; right: 0; height: 250px; background: #000; color: #10b981; font-family: monospace; font-size: 12px; padding: 10px; overflow-y: auto; border-top: 2px solid var(--primary); z-index: 1000; }
        .log-entry { margin-bottom: 5px; border-bottom: 1px solid #222; padding-bottom: 2px; white-space: pre-wrap; }
        .log-err { color: #ef4444; }
        .log-warn { color: #f59e0b; }
        .copy-logs { position: absolute; top: 5px; right: 10px; background: #333; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>👻 GhostSearch (Mobile Edition)</h2>
    <textarea id="qInput" placeholder="Enter Physics/Math question..."></textarea>
    <button id="searchBtn">Scrape YouTube Solution</button>
    
    <div id="videoArea">
        <div class="video-box">
            <iframe id="ytFrame" src="" allowfullscreen></iframe>
        </div>
        <p id="vidIdDisplay" style="text-align:center; font-size: 12px; color: #94a3b8; margin-top: 10px;"></p>
    </div>
</div>

<div id="mobileConsole">
    <button class="copy-logs" onclick="copyLogs()">Copy Logs</button>
    <div style="color: #666; margin-bottom: 10px;">-- SYSTEM LOGS --</div>
    <div id="logContainer"></div>
</div>

<script>
    const btn = document.getElementById('searchBtn');
    const logContainer = document.getElementById('logContainer');
    const videoArea = document.getElementById('videoArea');
    const frame = document.getElementById('ytFrame');
    const idDisplay = document.getElementById('vidIdDisplay');

    // Custom Logger Function
    function log(msg, type = 'info') {
        const entry = document.createElement('div');
        entry.className = 'log-entry' + (type === 'err' ? ' log-err' : '');
        const time = new Date().toLocaleTimeString();
        entry.innerText = `[${time}] ${msg}`;
        logContainer.prepend(entry);
    }

    function copyLogs() {
        const text = logContainer.innerText;
        navigator.clipboard.writeText(text);
        alert("Logs copied to clipboard!");
    }

    btn.onclick = async () => {
        const query = document.getElementById('qInput').value.trim();
        if(!query) return log("Error: Input is empty", 'err');

        log(`Starting search for: "${query}"`);
        videoArea.style.display = 'none';
        btn.disabled = true;

        try {
            // Using DuckDuckGo Lite for cleaner parsing
            const ddgUrl = `https://duckduckgo.com/lite/?q=${encodeURIComponent(query + " youtube solution")}`;
            log(`Target URL: ${ddgUrl}`);
            
            // Public Proxy to bypass CORS
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(ddgUrl)}`;
            log("Fetching through AllOrigins Proxy...");

            const response = await fetch(proxyUrl);
            
            if(!response.ok) {
                log(`HTTP Error: ${response.status}`, 'err');
                throw new Error("Proxy failed");
            }

            const html = await response.text();
            log(`Received ${html.length} bytes of HTML.`);

            // REGEX: Look for v= followed by 11 chars. 
            // Handles both normal (v=) and encoded (v%3D)
            const ytRegex = /(?:v%3D|v=)([a-zA-Z0-9_-]{11})/;
            const match = html.match(ytRegex);

            if(match && match[1]) {
                const vidId = match[1];
                log(`SUCCESS: Found Video ID [${vidId}]`);
                idDisplay.innerText = "Current ID: " + vidId;
                frame.src = `https://www.youtube.com/embed/${vidId}`;
                videoArea.style.display = 'block';
            } else {
                log("FAIL: No YouTube ID found in HTML stream.", 'warn');
                log("HTML Sample: " + html.substring(0, 200).replace(/</g, '&lt;'), 'warn');
            }

        } catch (err) {
            log(`NETWORK ERROR: ${err.message}`, 'err');
            log("POSSIBLE CAUSE: GitHub Pages/Browser blocking the Proxy request.", 'err');
        } finally {
            btn.disabled = false;
        }
    };

    log("GhostSearch Initialized on Mobile.");
</script>

</body>
</html>
